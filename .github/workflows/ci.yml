name: CI pipeline

on:
  pull_request:
    branches:
      - prod
      - stage
      - devel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '15'
      - name: Setup environment
        run: npm install
      - name: Linter
        run: npm run lint
#      - name: Formatter
#        run: npm run prettier
      - name: Test code 
        env:
          CI: true
        run: npm run test
      - name: Build code
        run: npm run build

